<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Résultats - MividAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html">Accueil</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="container">
    <h1>Tes Résultats</h1>
    <p class="subtitle">Voici ton analyse MividAI basée sur tes réponses.</p>
<p class="impact">
  Ce profil reflète une énergie dominante qui guide naturellement tes choix et ta direction de vie.
</p>
    <div id="results"></div>

    <button class="btn" onclick="window.location.href='questions.html'">Recommencer</button>
  </div>

  <script>
    function calculateLifePath(dateString) {
      if (!dateString) return null;

      const digits = dateString.replace(/-/g, "").split("").map(Number);
      let sum = digits.reduce((a, b) => a + b, 0);

      while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
        sum = sum.toString().split("").map(Number).reduce((a, b) => a + b, 0);
      }

      return sum;
    }

    function generateFusion(mainType, lifePath) {
      const base = {
        analytique: "Tu es naturellement orienté(e) vers la compréhension, la structure et la logique.",
        creatif: "Tu es animé(e) par la création, l’expression et l’envie de construire quelque chose d’unique.",
        humaniste: "Tu es profondément connecté(e) aux autres et à l’envie d’apporter du sens.",
        spirituel: "Tu es en quête de sens, d’alignement et de vérité intérieure."
      };

      const lifePathEnergy = {
        1: "Tu es poussé(e) à prendre des initiatives et à tracer ton propre chemin.",
        2: "Tu es invité(e) à collaborer et créer de l’harmonie autour de toi.",
        3: "Tu dois exprimer ta créativité et ta communication.",
        4: "Tu es fait(e) pour construire quelque chose de stable.",
        5: "Tu es appelé(e) à évoluer, explorer et vivre la liberté.",
        6: "Tu es tourné(e) vers le soin et la responsabilité.",
        7: "Tu es en quête de compréhension profonde.",
        8: "Tu es lié(e) à la réussite et à la matérialisation.",
        9: "Tu es tourné(e) vers l’impact humain et collectif.",
        11: "Tu portes une forte intuition et inspiration.",
        22: "Tu es capable de construire des projets ambitieux.",
        33: "Tu es dans une énergie de transmission et d’aide."
      };

      const tension = {
        analytique: "Ton défi sera d’éviter de trop analyser avant d’agir.",
        creatif: "Ton défi sera de rester constant(e) et structuré(e).",
        humaniste: "Ton défi sera de ne pas t’oublier dans les autres.",
        spirituel: "Ton défi sera de passer à l’action concrète."
      };

      return `
        ${base[mainType] || ""}
        ${lifePathEnergy[lifePath] || ""}
        ${tension[mainType] || ""}
      `;
    }

    const lifePathMeaning = {
      1: "Leader naturel, tu es fait(e) pour initier.",
      2: "Tu crées l’harmonie et la connexion.",
      3: "Créativité et expression sont tes forces.",
      4: "Tu es structuré(e) et bâtisseur(se).",
      5: "Tu es fait(e) pour évoluer et explorer.",
      6: "Tu es tourné(e) vers le soin et les autres.",
      7: "Tu cherches la vérité et la profondeur.",
      8: "Tu es lié(e) à la réussite et au pouvoir.",
      9: "Tu es guidé(e) par l’impact humain.",
      11: "Tu es intuitif(ve) et inspirant(e).",
      22: "Tu es un bâtisseur de grande vision.",
      33: "Tu es un guide et un transmetteur."
    };

    const resultData = JSON.parse(localStorage.getItem("mividai_result") || "null");
    const birthdate = localStorage.getItem("birthdate");
    const lifePath = calculateLifePath(birthdate);
    const resultsDiv = document.getElementById("results");

    if (!resultData) {
      resultsDiv.innerHTML = `
        <p>Aucun résultat trouvé.</p>
        <p><a href="questions.html">Recommence le questionnaire</a>.</p>
      `;
    } else {
      resultsDiv.innerHTML = `
        <div class="result-card">
<h2 class="big-title">
  ${resultData.emoji} ${resultData.title}
</h2>
          <p><strong>Profil principal :</strong> ${resultData.title}</p>
          <p><strong>Énergie secondaire :</strong> ${resultData.secondaryTitle}</p>

          <p>${resultData.description}</p>

          <h3>🔮 Ton chemin de vie</h3>
          <p>
            <strong>${lifePath ?? "Non disponible"}</strong>
            ${lifePath ? `— ${lifePathMeaning[lifePath]}` : ""}
          </p>

          <h3>🧭 Lecture de ta mission</h3>
          <p>${generateFusion(resultData.mainType, lifePath)}</p>

          <h3>🌟 Tes forces</h3>
          <ul>
            ${resultData.strengths.map(item => `<li>${item}</li>`).join("")}
          </ul>

          <h3>⚠️ Tes freins</h3>
          <ul>
            ${resultData.blocks.map(item => `<li>${item}</li>`).join("")}
          </ul>

          <h3>🌟 Ta combinaison unique</h3>
          <p>${resultData.comboText}</p>

          <h3>🚀 Ton conseil</h3>
          <p>${resultData.advice}</p>

          <h3>✨ Ta synthèse de mission</h3>
          <p>
            ${resultData.title} avec un chemin de vie ${lifePath ?? "non disponible"},
            tu es ici pour construire une vie alignée avec tes valeurs profondes.
            Ton potentiel réside dans ta capacité à évoluer, comprendre et agir.
            Si tu suis cette direction, tu peux réellement créer une vie qui te ressemble.
          </p>
        </div>
      `;
    }
  </script>
</body>
</html>
