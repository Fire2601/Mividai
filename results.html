<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Résultats - MividAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html">Accueil</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="container">
    <h1>Tes Résultats</h1>
    <p class="subtitle">Voici ton analyse MividAI basée sur tes réponses.</p>

    <div id="results"></div>

    <button class="btn" onclick="window.location.href='questions.html'">Recommencer</button>
  </div>

  <script>
    const resultData = JSON.parse(localStorage.getItem("mividai_result") || "null");
    const resultsDiv = document.getElementById("results");

    if (!resultData) {
      resultsDiv.innerHTML = `
        <p>Aucun résultat trouvé.</p>
        <p><a href="questions.html">Recommence le questionnaire</a>.</p>
      `;
    } else {
      const titles = {
        humaniste: "Le Guide du Lien Humain",
        analytique: "L’Architecte de Clarté",
        spirituel: "L’Explorateur de Sens",
        creatif: "Le Créateur de Possibilités"
      };

      const punchlines = {
        humaniste: "Tu es fait(e) pour connecter, soutenir et impacter les autres.",
        analytique: "Tu es fait(e) pour comprendre, structurer et construire.",
        spirituel: "Tu es fait(e) pour chercher, ressentir et éveiller.",
        creatif: "Tu es fait(e) pour imaginer, créer et initier."
      };

      function dynamicInsight(scores) {
        const values = Object.values(scores);
        const total = values.reduce((a, b) => a + b, 0);
        const max = Math.max(...values);
        const ratio = max / total;

        if (ratio > 0.6) {
          return "Tu as un profil très affirmé. Ta direction intérieure semble déjà forte et bien présente.";
        } else if (ratio > 0.45) {
          return "Tu es dans une phase de structuration. Plusieurs dimensions de toi cherchent à s’aligner.";
        } else {
          return "Tu es dans une phase d’exploration. Ton potentiel est large, mais demande encore à être clarifié.";
        }
      }

      function immediateAction(mainType) {
        if (mainType === "analytique") {
          return "Choisis une décision que tu repousses et passe aujourd’hui à une action concrète, même petite.";
        }
        if (mainType === "creatif") {
          return "Commence une idée ou un projet dès aujourd’hui, même imparfaitement, pour transformer ton élan en mouvement.";
        }
        if (mainType === "humaniste") {
          return "Apporte aujourd’hui de la valeur à quelqu’un ou reconnecte-toi à une relation qui compte réellement pour toi.";
        }
        return "Prends 10 minutes seul(e) pour clarifier ce que tu ressens vraiment, puis note une action concrète à faire aujourd’hui.";
      }

      resultsDiv.innerHTML = `
        <div class="result-card">
          <h2>${resultData.emoji} ${titles[resultData.mainType]}</h2>

          <p class="result-punchline">
            ${punchlines[resultData.mainType]}
          </p>

          <p><strong>Profil principal :</strong> ${resultData.title}</p>
          <p><strong>Énergie secondaire :</strong> ${resultData.secondaryTitle}</p>

          <h3>🧠 Lecture globale</h3>
          <p>${dynamicInsight(resultData.scores)}</p>

          <h3>🌟 Tes forces naturelles</h3>
          <ul>
            <li>${resultData.strengths[0]}</li>
            <li>${resultData.strengths[1]}</li>
            <li>${resultData.strengths[2]}</li>
          </ul>

          <h3>⚠️ Ce qui peut te freiner</h3>
          <ul>
            <li>${resultData.blocks[0]}</li>
            <li>${resultData.blocks[1]}</li>
            <li>${resultData.blocks[2]}</li>
          </ul>

          <h3>🧭 Lecture MividAI</h3>
          <p>${resultData.comboText}</p>

          <h3>🚀 Ton prochain cap</h3>
          <p>${resultData.advice}</p>

          <div class="action-box">
            <strong>👉 Action immédiate</strong>
            <p>${immediateAction(resultData.mainType)}</p>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
