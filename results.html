<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Résultats - MividAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html">Accueil</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="container">
    <h1>Tes Résultats</h1>
    <p class="subtitle">Voici ton analyse MividAI basée sur tes réponses.</p>

    <div id="results"></div>

    <button class="btn" onclick="window.location.href='questions.html'">Recommencer</button>
  </div>
<script>
  const resultsDiv = document.getElementById("results");

  // 🔥 DEBUG VISUEL DIRECT
  resultsDiv.innerHTML = "<h2>DEBUG EN COURS...</h2>";

  const raw = localStorage.getItem("mividai_result");

  if (!raw) {
    resultsDiv.innerHTML += "<p>❌ localStorage VIDE</p>";
  } else {
    resultsDiv.innerHTML += "<p>✅ localStorage trouvé</p>";
    resultsDiv.innerHTML += "<pre>" + raw + "</pre>";
  }

  try {
    const resultData = JSON.parse(raw);

    resultsDiv.innerHTML += "<p>✅ JSON PARSÉ</p>";
    resultsDiv.innerHTML += "<pre>" + JSON.stringify(resultData, null, 2) + "</pre>";

  } catch (e) {
    resultsDiv.innerHTML += "<p>❌ ERREUR JSON</p>";
    resultsDiv.innerHTML += "<pre>" + e.message + "</pre>";
  }
</script>
</body>
</html>
