<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>MividAI - Questions</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .question {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      background: #1e293b;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background: #334155;
    }

    .progress {
      height: 10px;
      background: #1e293b;
      border-radius: 10px;
      margin-bottom: 30px;
    }

    .progress-bar {
      height: 10px;
      background: #38bdf8;
      border-radius: 10px;
      width: 0%;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>MividAI</h1>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="quiz"></div>

</div>

<script>

const questions = [
  {
    question: "Comment te sens-tu actuellement ?",
    answers: ["😄 Bien", "😐 Neutre", "😕 Perdu"]
  },
  {
    question: "As-tu un objectif clair ?",
    answers: ["Oui", "Non", "Pas vraiment"]
  },
  {
    question: "Tu préfères :",
    answers: ["🧠 Réfléchir", "🚀 Agir", "🎨 Créer"]
  },
  {
    question: "Qu’est-ce qui te freine le plus ?",
    answers: ["Peur", "Trop réfléchir", "Manque de temps"]
  },
  {
    question: "Où veux-tu être dans 5 ans ?",
    answers: ["💼 Réussite", "🌍 Liberté", "🧘‍♂️ Équilibre"]
  }
];

let currentQuestion = 0;
let responses = [];

function showQuestion() {
  const quiz = document.getElementById("quiz");
  const q = questions[currentQuestion];

  quiz.innerHTML = `
    <div class="question">${q.question}</div>
    ${q.answers.map(a => 
      `<button class="btn" onclick="selectAnswer('${a}')">${a}</button>`
    ).join("")}
  `;

  updateProgress();
}

function selectAnswer(answer) {
  responses.push(answer);
  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    localStorage.setItem("mividai_answers", JSON.stringify(responses));
    window.location.href = "result.html";
  }
}

function updateProgress() {
  const progress = ((currentQuestion) / questions.length) * 100;
  document.getElementById("progressBar").style.width = progress + "%";
}

showQuestion();

</script>

</body>
</html>
